<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#06111f">

<title>Simple Chat</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#12385a 0,#06111f 42%,#02070d 100%);
  color:#fff;
  min-height:100vh;
  overflow:hidden;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

/* LOGIN */

#loginScreen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
  background:
    radial-gradient(circle at 50% 20%,#123c63,#030a12 65%);
}

.loginBox{
  width:100%;
  max-width:390px;
  padding:28px;
  border:1px solid rgba(100,190,255,.25);
  border-radius:24px;
  background:rgba(5,18,31,.82);
  box-shadow:
    0 25px 80px rgba(0,0,0,.5),
    inset 0 1px rgba(255,255,255,.06);
  backdrop-filter:blur(20px);
}

.logo{
  width:70px;
  height:70px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:22px;
  background:linear-gradient(135deg,#22aaff,#1765ff);
  box-shadow:0 0 35px rgba(35,160,255,.4);
  font-size:30px;
  font-weight:900;
}

.loginBox h1{
  text-align:center;
  font-size:25px;
  margin-bottom:8px;
}

.loginBox p{
  text-align:center;
  color:#8fa9bd;
  font-size:14px;
  margin-bottom:25px;
}

.input{
  width:100%;
  padding:15px 16px;
  border-radius:14px;
  border:1px solid #1d405b;
  outline:none;
  background:#071827;
  color:#fff;
}

.input:focus{
  border-color:#20aaff;
  box-shadow:0 0 0 3px rgba(32,170,255,.1);
}

.joinBtn{
  width:100%;
  margin-top:12px;
  padding:15px;
  border-radius:14px;
  color:#fff;
  font-weight:800;
  background:linear-gradient(135deg,#1299ed,#175cff);
  box-shadow:0 10px 30px rgba(20,120,255,.2);
}

/* APP */

#app{
  display:none;
  height:100vh;
  height:100dvh;
  flex-direction:column;
}

.header{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 16px;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(3,12,21,.8);
  backdrop-filter:blur(15px);
}

.titleArea{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  background:linear-gradient(135deg,#168ff0,#174fff);
  font-weight:900;
}

.title{
  font-weight:800;
}

.status{
  margin-top:3px;
  display:flex;
  align-items:center;
  gap:6px;
  color:#6d879a;
  font-size:12px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ff4757;
}

.dot.online{
  background:#24e28a;
  box-shadow:0 0 10px #24e28a;
}

.onlineBox{
  padding:8px 12px;
  border-radius:12px;
  background:#071a2a;
  color:#83a8c2;
  font-size:12px;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:18px 14px 12px;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:4px;
}

.chat::-webkit-scrollbar-thumb{
  background:#173a53;
  border-radius:10px;
}

.message{
  display:flex;
  margin-bottom:12px;
  animation:messageIn .22s ease;
}

.message.me{
  justify-content:flex-end;
}

.bubble{
  max-width:min(78%,420px);
  padding:10px 12px 8px;
  border-radius:17px;
  background:#102334;
  border:1px solid rgba(255,255,255,.04);
  box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.message.me .bubble{
  background:linear-gradient(135deg,#096bb5,#1152b7);
  border-bottom-right-radius:5px;
}

.message:not(.me) .bubble{
  border-bottom-left-radius:5px;
}

.sender{
  color:#55baff;
  font-size:11px;
  font-weight:800;
  margin-bottom:4px;
}

.message.me .sender{
  color:#bde7ff;
}

.text{
  line-height:1.4;
  font-size:14px;
  word-break:break-word;
}

.time{
  text-align:right;
  margin-top:4px;
  color:#8da8ba;
  font-size:9px;
}

.system{
  width:max-content;
  max-width:90%;
  margin:10px auto;
  padding:7px 12px;
  border-radius:30px;
  background:#071a29;
  color:#66879c;
  font-size:11px;
}

/* EMPTY */

.empty{
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#668095;
  text-align:center;
}

.emptyIcon{
  font-size:38px;
  margin-bottom:10px;
}

.empty p{
  font-size:13px;
}

/* COMPOSER */

.composer{
  display:flex;
  gap:8px;
  padding:10px;
  padding-bottom:max(10px,env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.07);
  background:rgba(3,12,21,.9);
  backdrop-filter:blur(18px);
}

.messageInput{
  flex:1;
  min-width:0;
  padding:13px 15px;
  border-radius:18px;
  outline:none;
  border:1px solid #19374d;
  background:#071725;
  color:#fff;
}

.messageInput:focus{
  border-color:#1b9de7;
}

.send{
  width:48px;
  min-width:48px;
  border-radius:17px;
  background:linear-gradient(135deg,#119eea,#1559ff);
  color:#fff;
  font-size:18px;
  font-weight:900;
}

.send:active,
.joinBtn:active{
  transform:scale(.96);
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:500px){
  .onlineBox{
    display:none;
  }

  .bubble{
    max-width:84%;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen">

  <div class="loginBox">

    <div class="logo">C</div>

    <h1>Simple Chat</h1>

    <p>
      Masukkan nama untuk bergabung
      ke chat real-time.
    </p>

    <input
      id="username"
      class="input"
      maxlength="20"
      autocomplete="off"
      placeholder="Nama kamu..."
    >

    <button
      id="joinBtn"
      class="joinBtn"
    >
      MASUK CHAT
    </button>

  </div>

</section>


<!-- APP -->

<main id="app">

  <header class="header">

    <div class="titleArea">

      <div id="myAvatar" class="avatar">
        ?
      </div>

      <div>
        <div class="title">
          Simple Chat
        </div>

        <div class="status">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">
            Menghubungkan...
          </span>
        </div>
      </div>

    </div>

    <div id="onlineBox" class="onlineBox">
      0 online
    </div>

  </header>


  <section id="chat" class="chat">

    <div id="empty" class="empty">

      <div class="emptyIcon">
        C
      </div>

      <p>
        Belum ada pesan.<br>
        Kirim pesan pertama!
      </p>

    </div>

  </section>


  <form id="composer" class="composer">

    <input
      id="messageInput"
      class="messageInput"
      autocomplete="off"
      maxlength="1000"
      placeholder="Tulis pesan..."
    >

    <button
      class="send"
      type="submit"
    >
      ➤
    </button>

  </form>

</main>


<script>
const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const usernameInput =
  document.getElementById("username");

const joinBtn =
  document.getElementById("joinBtn");

const chat =
  document.getElementById("chat");

const empty =
  document.getElementById("empty");

const messageInput =
  document.getElementById("messageInput");

const composer =
  document.getElementById("composer");

const statusDot =
  document.getElementById("statusDot");

const statusText =
  document.getElementById("statusText");

const onlineBox =
  document.getElementById("onlineBox");

const myAvatar =
  document.getElementById("myAvatar");

let socket = null;
let myUsername = "";
let connected = false;


/* =========================
   SERVER ADDRESS
========================= */

function getSocketURL(){

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  return protocol +
    "//" +
    location.host;
}


/* =========================
   LOGIN
========================= */

joinBtn.addEventListener("click", joinChat);

usernameInput.addEventListener("keydown", e => {
  if(e.key === "Enter"){
    joinChat();
  }
});

function joinChat(){

  const name =
    usernameInput.value.trim();

  if(!name){
    usernameInput.focus();
    return;
  }

  myUsername = name.slice(0,20);

  myAvatar.textContent =
    myUsername.charAt(0).toUpperCase();

  loginScreen.style.display = "none";
  app.style.display = "flex";

  connect();
}


/* =========================
   CONNECT
========================= */

function connect(){

  statusText.textContent =
    "Menghubungkan...";

  statusDot.classList.remove("online");

  try{

    socket =
      new WebSocket(getSocketURL());

  }catch(err){

    setOffline();
    return;

  }


  socket.addEventListener("open", () => {

    connected = true;

    statusText.textContent =
      "Online";

    statusDot.classList.add("online");

    socket.send(JSON.stringify({
      type:"login",
      username:myUsername
    }));

  });


  socket.addEventListener("message", event => {

    let data;

    try{
      data = JSON.parse(event.data);
    }catch{
      return;
    }

    handleServerMessage(data);

  });


  socket.addEventListener("close", () => {

    connected = false;

    setOffline();

    setTimeout(() => {

      if(myUsername){
        connect();
      }

    },3000);

  });


  socket.addEventListener("error", () => {

    connected = false;

    setOffline();

  });

}


/* =========================
   SERVER MESSAGE
========================= */

function handleServerMessage(data){

  if(data.type === "login_ok"){
    return;
  }


  if(data.type === "history"){

    if(Array.isArray(data.messages)){

      data.messages.forEach(msg => {
        addMessage(msg,false);
      });

    }

    return;
  }


  if(data.type === "message"){

    addMessage(data.message,true);

    return;
  }


  if(data.type === "users"){

    updateOnline(data.users);

    return;
  }


  if(data.type === "system"){

    addSystemMessage(data.text);

    return;
  }

}


/* =========================
   SEND MESSAGE
========================= */

composer.addEventListener("submit", e => {

  e.preventDefault();

  if(!connected){
    return;
  }

  const text =
    messageInput.value.trim();

  if(!text){
    return;
  }

  socket.send(JSON.stringify({
    type:"message",
    text
  }));

  messageInput.value = "";

  messageInput.focus();

});


/* =========================
   ADD MESSAGE
========================= */

function addMessage(message,scroll=true){

  if(empty){
    empty.remove();
  }

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message" +
    (message.username === myUsername
      ? " me"
      : "");

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";


  const sender =
    document.createElement("div");

  sender.className = "sender";

  sender.textContent =
    message.username === myUsername
      ? "Kamu"
      : message.username;


  const text =
    document.createElement("div");

  text.className = "text";

  text.textContent =
    message.text;


  const time =
    document.createElement("div");

  time.className = "time";

  time.textContent =
    message.time || "";


  bubble.appendChild(sender);
  bubble.appendChild(text);
  bubble.appendChild(time);

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  if(scroll){
    scrollBottom();
  }

}


/* =========================
   SYSTEM MESSAGE
========================= */

function addSystemMessage(text){

  if(empty){
    empty.remove();
  }

  const el =
    document.createElement("div");

  el.className = "system";

  el.textContent = text;

  chat.appendChild(el);

  scrollBottom();

}


/* =========================
   ONLINE USERS
========================= */

function updateOnline(users){

  if(!Array.isArray(users)){
    return;
  }

  onlineBox.textContent =
    users.length +
    (users.length === 1
      ? " online"
      : " online");

}


/* =========================
   OFFLINE
========================= */

function setOffline(){

  statusText.textContent =
    "Offline";

  statusDot.classList.remove("online");

}


/* =========================
   SCROLL
========================= */

function scrollBottom(){

  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });

}


/* =========================
   ENTER = SEND
========================= */

messageInput.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter" && !e.shiftKey){

      e.preventDefault();

      composer.requestSubmit();

    }

  }
);
</script>

</body>
</html>
